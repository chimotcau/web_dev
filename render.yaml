services:
  - type: web
    name: crypto-portfolio-manager
    runtime: python
    rootDir: cryptocurrency
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask --app run.py db upgrade && gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-portfolio-db
          property: connectionString

databases:
  - name: crypto-portfolio-db
    databaseName: crypto_portfolio
    user: crypto
